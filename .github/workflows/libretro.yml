name: citra-libretro

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CORE_ARGS: -DENABLE_LIBRETRO=ON

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  libretro-windows:
    runs-on: ubuntu-latest
    env:
      OS: windows
      TARGET: x86_64
      BUILD_DIR: build/windows-x86_64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_ctime,include_file_mtime
      EXTRA_CORE_ARGS: -DENABLE_LTO=OFF -DCITRA_USE_PRECOMPILED_HEADERS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -G Ninja
      CMAKE: x86_64-w64-mingw32.static-cmake
      IMAGE: reallibretroretroarch/libretro-build-mxe-win-cross-cores:mingw12
      EXTRA_PATH: bin/Release
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.job }}-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ github.job }}-${{ env.TARGET }}-
      - name: Build in cross-container
        run: |
          docker pull $IMAGE
          docker run --rm --user root \
              -e CCACHE_DIR="${CCACHE_DIR}" \
              -e CCACHE_COMPILERCHECK="${CCACHE_COMPILERCHECK}" \
              -e CCACHE_SLOPPINESS="${CCACHE_SLOPPINESS}" \
              -e CCACHE_COMPRESS=1 \
              -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
              -w "${GITHUB_WORKSPACE}" \
              $IMAGE \
              bash -lc "\
                  ${CMAKE} $CORE_ARGS $EXTRA_CORE_ARGS \"-DCMAKE_CXX_FLAGS=-include algorithm -include array -include chrono -include memory -include bit\" . -B $BUILD_DIR && \
                  ${CMAKE} --build $BUILD_DIR --target citra_libretro --config Release -j $(nproc) && \
                  ccache -s && \
                  chown -R $(id -u):$(id -g) $CCACHE_DIR && \
                  x86_64-w64-mingw32.static-strip -s $BUILD_DIR/$EXTRA_PATH/azahar_libretro.*"
      - name: Pack
        run: ./.ci/libretro-pack.sh
      - name: Generate SBOM
        if: ${{ github.ref_type == 'tag' }}
        uses: anchore/sbom-action@v0
        with:
          path: build/
          format: spdx-json
          output-file: libretro-windows.spdx.json
          upload-artifact: false
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: |
            ./*.zip
            ./*.spdx.json
      - name: Attest artifacts
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            ./*.zip
          sbom-path: libretro-windows.spdx.json
